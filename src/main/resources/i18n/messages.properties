mcp.instructions=Novel browsing service. Use list_categories / list_novels to look up ids, then upload_epub to import an EPUB (base64) or update_novel to edit a book's metadata.
mcp.tool.upload.description=Import an EPUB book: parses chapters, extracts the cover and creates the novel. Pass the raw file as base64. Duplicate content (same SHA-256) is rejected.
mcp.tool.update.description=Update the metadata of an existing novel (title, author, description, status, tags, category). Only the provided fields are changed.
mcp.tool.listCategories.description=List all categories with their ids; call this before upload_epub when the category id is unknown.
mcp.tool.listNovels.description=List novels (newest update first) with their ids; call this before update_novel when the id is unknown.
mcp.schema.upload.fileName=Original file name, must end with .epub
mcp.schema.upload.contentBase64=Base64 encoded content of the EPUB file
mcp.schema.upload.categoryId=Target category id; omit to use categoryName
mcp.schema.upload.categoryName=Target category name, created when it does not exist yet (defaults to app.upload.default-category-name)
mcp.schema.upload.status=Serialization status: ONGOING or FINISHED, default ONGOING
mcp.schema.upload.tags=Comma separated tags; defaults to the EPUB dc:subject
mcp.schema.update.id=Novel id to update (use list_novels to find it)
mcp.schema.update.title=New title
mcp.schema.update.author=New author
mcp.schema.update.description=New description
mcp.schema.update.status=New status: ONGOING or FINISHED
mcp.schema.update.tags=New tags, comma separated
mcp.schema.update.categoryId=Move the novel to this category id (must already exist)
mcp.schema.listNovels.limit=Maximum number of novels to return, 1-100, default 20
