mcp.instructions=小说浏览服务。先用 list_categories / list_novels 查询 id，再用 upload_epub 导入 EPUB（base64）或用 update_novel 修改书目信息。
mcp.tool.upload.description=导入 EPUB 书籍：解析章节、提取封面并创建书目。文件内容以 base64 传入，内容重复（SHA-256 相同）会被拒绝。
mcp.tool.update.description=修改已有书目的元数据（书名、作者、简介、状态、标签、分类），仅更新传入的字段。
mcp.tool.listCategories.description=列出所有分类及其 id；不确定分类 id 时，在调用 upload_epub 之前先调用它。
mcp.tool.listNovels.description=按更新时间倒序列出书目及其 id；不确定小说 id 时，在调用 update_novel 之前先调用它。
mcp.schema.upload.fileName=原始文件名，必须以 .epub 结尾
mcp.schema.upload.contentBase64=EPUB 文件内容的 base64 编码
mcp.schema.upload.categoryId=目标分类 id；不传则使用 categoryName
mcp.schema.upload.categoryName=目标分类名，不存在时自动创建（默认取 app.upload.default-category-name）
mcp.schema.upload.status=连载状态：ONGOING 或 FINISHED，默认 ONGOING
mcp.schema.upload.tags=逗号分隔的标签；默认取 EPUB 的 dc:subject
mcp.schema.upload.language=该版本的语言，如 en 或 zh_CN；默认取 EPUB 的 dc:language
mcp.schema.upload.versionGroup=该上传所属已有作品的版本组；不传时自动生成
mcp.schema.update.id=要修改的小说 id（可用 list_novels 查询）
mcp.schema.update.title=新书名
mcp.schema.update.author=新作者
mcp.schema.update.description=新简介
mcp.schema.update.status=新状态：ONGOING 或 FINISHED
mcp.schema.update.tags=新标签，逗号分隔
mcp.schema.update.language=该版本的新语言，如 en 或 zh_CN
mcp.schema.update.categoryId=把小说移动到该分类 id（分类必须已存在）
mcp.schema.listNovels.limit=返回书目的最大数量，1-100，默认 20
