server:
  port: 8080

spring:
  application:
    name: novel-browse
  servlet:
    multipart:
      # EPUB 上传大小限制（单文件 / 整个请求）
      max-file-size: 60MB
      max-request-size: 60MB
  datasource:
    # 内存数据库，进程退出即释放
    url: jdbc:h2:mem:noveldb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null

# 跨域：前端独立部署时放开来源（生产环境请填写具体域名）
app:
  cors:
    allowed-origins: '*'
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allow-credentials: false
  admin:
    # 后台管理接口（/admin/**）的简易鉴权令牌，请求头 X-Admin-Token
    # 留空表示不校验（仅适合本地与内网），生产环境请设置随机值
    token: ''

# RocksDB 缓存
rocksdb:
  cache:
    enabled: true
    path: ./.rocksdb-cache
    ttl: 10m
    # 进程启动时清空本地缓存文件，避免与内存库重新种子的数据不一致
    clean-on-start: true
    names:
      - novel-home-list
      - novel-detail
      - novel-chapter
      - novel-chapter-no
      - novel-chapter-list

# 日志：级别与输出策略在 logback-spring.xml 中定义（默认 INFO、输出到控制台）
# 运行期覆盖：--logging.level.com.novel.browse=DEBUG 或环境变量 LOG_LEVEL_APP=DEBUG
