server:
  port: 8080


spring:
  application:
    name: novel-browse
  servlet:
    multipart:
      # EPUB 上传大小限制（单文件 / 整个请求）
      max-file-size: 60MB
      max-request-size: 60MB
  datasource:
    # 内存数据库，进程退出即释放
    url: jdbc:h2:mem:noveldb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null
# 跨域：前端独立部署时放开来源（生产环境请填写具体域名）
app:
  cors:
    allowed-origins: '*'
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    # 读者账户靠 cookie 维持登录态，前端跨域（不同端口）必须允许携带凭证
    allow-credentials: true
  i18n:
    # 多语言：接口返回的 message 按请求语言输出（资源文件 src/main/resources/i18n/messages*.properties）
    # 语言来源：?lang= 参数 > Accept-Language 请求头 > default-locale；不在 supported-locales 内一律回退默认语言
    # 同时也是书目 / 分类列表的兜底：请求没带 language 也没带 Accept-Language 时返回该语言的书，不会中英混排
    default-locale: zh_CN
    supported-locales: [ 'en', 'zh_CN' ]
  auth:
    # 读者账户：会话有效期（天），注册/登录后写入同名 cookie（HttpOnly）
    session-days: 30
    cookie-name: nb_session
    # HTTPS 站点设为 true（浏览器只通过 HTTPS 回传 cookie）；当前是 HTTP 部署，保持 false
    cookie-secure: false
    cookie-same-site: Lax
  admin:
    # 后台管理接口（/admin/**）的简易鉴权令牌，请求头 X-Admin-Token
    # 留空表示不校验（仅适合本地与内网），生产环境请设置随机值
    token: ''
  signature:
    # 接口签名：HMAC-SHA256(secret, method \n uri \n timestamp \n nonce \n bodySha256)
    # 请求头：X-App-Key / X-Timestamp（秒级时间戳）/ X-Nonce / X-Signature
    # secret 留空或 enabled=false 时完全不校验（本地与前端无感知）
    enabled: true
    app-key: ''
    secret: ''
    # 允许的时间偏差（秒），超出即拒绝
    time-window-seconds: 300
    # 免签路径（Ant 模式）；启用签名后健康检查路径需放这里，否则部署脚本的健康检查会失败
    # /mcp 由 app.mcp.token 鉴权，MCP 客户端无法签名，故默认免签
    # /auth/** 与 /me/** 是浏览器账户接口，浏览器无法签名，故免签（登录态本身由 cookie 校验）
    exclude-paths: [ '/covers/**', '/mcp', '/auth/**', '/me/**' ]
  mcp:
    # MCP（Model Context Protocol）端点：POST /mcp（JSON-RPC 2.0，Streamable HTTP）
    # 工具：upload_epub / update_novel / list_categories / list_novels
    # 关闭后置为 false，端点不再注册
    enabled: true
    # 鉴权令牌：请求头 Authorization: Bearer <token> 或 X-Mcp-Token
    # 留空时回退到 app.admin.token；两者都为空则不校验（会打印警告）
    token: ''
  db:
    snapshot:
      # 内存库快照：进程停止时把整库导出到文件，下次启动再加载回来（仅 H2 生效，其他数据库自带持久化）
      # 只有优雅停止（SIGTERM，脚本 stop/restart 走的就是它）才会导出；kill -9 不会
      enabled: true
      file: './data/db-snapshot.sql'
  cover:
    # 从 EPUB 提取的封面图保存目录（部署脚本会传 $APP_ROOT/data/covers），经 /covers/** 访问
    dir: './data/covers'
  upload:
    # 上传的 EPUB 原文件保存目录（部署脚本会传 $APP_ROOT/data/epub）
    dir: './data/epub'
    # 启动时扫描该目录，把未导入的 EPUB 自动入库
    scan-on-start: true
    # 直接放在上传目录根下的 EPUB 归入该分类（不存在则自动创建）
    default-category-name: 'Imported'
    # 启动时为已有分类补齐对应的磁盘子目录
    ensure-category-dirs: true
    # 扫描导入时的连载状态：FINISHED / ONGOING
    default-status: 'FINISHED'

# RocksDB 缓存
rocksdb:
  cache:
    enabled: true
    path: ./.rocksdb-cache
    ttl: 10m
    # 进程启动时清空本地缓存文件，避免与内存库重新种子的数据不一致
    clean-on-start: true
    names:
      - novel-home-list
      - novel-detail
      - novel-chapter
      - novel-chapter-no
      - novel-chapter-list

# 日志：级别与输出策略在 logback-spring.xml 中定义（默认 INFO、输出到控制台）
# 运行期覆盖：--logging.level.com.novel.browse=DEBUG 或环境变量 LOG_LEVEL_APP=DEBUG
