server:
  port: 8080

spring:
  application:
    name: novel-browse
  datasource:
    # 内存数据库，进程退出即释放
    url: jdbc:h2:mem:noveldb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null

# 跨域：前端独立部署时放开来源（生产环境请填写具体域名）
app:
  cors:
    allowed-origins: '*'
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allow-credentials: false

# RocksDB 缓存
rocksdb:
  cache:
    enabled: true
    path: ./.rocksdb-cache
    ttl: 10m
    # 进程启动时清空本地缓存文件，避免与内存库重新种子的数据不一致
    clean-on-start: true
    names:
      - novel-home-list
      - novel-detail
      - novel-chapter
      - novel-chapter-no
      - novel-chapter-list

logging:
  level:
    root: INFO
    com.novel.browse: INFO
